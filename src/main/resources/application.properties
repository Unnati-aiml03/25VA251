spring.application.name=homemade-goodies-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/homemade_goodies?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value-1234567890}
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
